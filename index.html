<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Визитка</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <div class="profile-card">
      <img src="avatar.jpg" alt="Аватар" class="avatar" />
      <div class="headline">
        <h1>Имя Фамилия</h1>
        <p class="subtitle">Фронтенд разработчик / Визитка</p>
      </div>
      <div class="info-panel">
        <h2>Обо мне</h2>
        <p>Добро пожаловать на сайт. Здесь представлена моя визитка, и сайт сейчас включен.</p>
      </div>
      <div class="link-buttons">
        <a class="link-button" href="https://github.com/" target="_blank" rel="noreferrer noopener">
          <span>GitHub</span>
        </a>
        <a class="link-button" href="mailto:example@example.com">
          <span>Написать</span>
        </a>
      </div>
    </div>
  </div>

  <div id="disabled-overlay" class="disabled-overlay" style="display: none;">
    <div class="disabled-message">
      <p id="disabled-text"></p>
    </div>
  </div>
</body>
</html>
